name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify migrations build the schema from scratch
        # A fresh deploy only ever runs migrations. This asserts the chain applies to
        # an empty database and lands on exactly the schema the models describe —
        # the check that auto_create_schema used to hide locally.
        env:
          DATABASE_URL: "sqlite:///./ci_check.db"
          JWT_SECRET: ci-only-not-a-real-secret
          APP_ENV: development
        run: |
          alembic upgrade head
          python scripts/check_schema_drift.py

      - name: Run tests
        env:
          JWT_SECRET: ci-only-not-a-real-secret
          DATABASE_URL: "sqlite:///:memory:"
          APP_ENV: development
        run: pytest -q -p no:warnings

  frontend:
    name: Frontend (vitest + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
